
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Creator</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            border: 2px solid #ddd;
        }

        input {
            padding: 8px;
        }

        #addBtn {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        .question-card {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 12px;
        }

        .delete-btn {
            background: red;
            color: white;
            padding: 6px 12px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>New Quiz Creator</h1>

    <div class="input-area">

        <input id="questionInput" type="text" placeholder="Enter question">
        <input id="optionA" type="text" placeholder="Option A">
        <input id="optionB" type="text" placeholder="Option B">
        <input id="optionC" type="text" placeholder="Option C">
        <input id="optionD" type="text" placeholder="Option D">

        <button id="addBtn">Add Question</button>

    </div>

    <div id="quizList"></div>

    <script>

        let addBtn = document.getElementById("addBtn");

        addBtn.addEventListener("click", function() {

            let question = document.getElementById("questionInput").value;
            let a = document.getElementById("optionA").value;
            let b = document.getElementById("optionB").value;
            let c = document.getElementById("optionC").value;
            let d = document.getElementById("optionD").value;

            if (question == "" || a == "" || b == "" || c == "" || d == "") {
                alert("Please fill all fields!");
            }

            else {

                let quizList = document.getElementById("quizList");

                let card = document.createElement("div");
                card.className = "question-card";

                let heading = document.createElement("h3");
                heading.innerText = question;

                let ul = document.createElement("ul");

                let li1 = document.createElement("li");
                li1.innerText = a;

                let li2 = document.createElement("li");
                li2.innerText = b;

                let li3 = document.createElement("li");
                li3.innerText = c;

                let li4 = document.createElement("li");
                li4.innerText = d;

                ul.appendChild(li1);
                ul.appendChild(li2);
                ul.appendChild(li3);
                ul.appendChild(li4);

                let deleteBtn = document.createElement("button");
                deleteBtn.innerText = "Delete";
                deleteBtn.className = "delete-btn";

                deleteBtn.addEventListener("click", function() {
                    card.remove();
                });

                card.appendChild(heading);
                card.appendChild(ul);
                card.appendChild(deleteBtn);

                quizList.appendChild(card);

                document.getElementById("questionInput").value = "";
                document.getElementById("optionA").value = "";
                document.getElementById("optionB").value = "";
                document.getElementById("optionC").value = "";
                document.getElementById("optionD").value = "";

                alert("Question added successfully!");

            }

        });

    </script>

</body>
</html>
