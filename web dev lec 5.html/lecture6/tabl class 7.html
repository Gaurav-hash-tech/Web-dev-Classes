<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table format</title>
    <style>
     table{border: 1px solid black;

     }
     thead{background-color: aquamarine;

     }
     tbody{font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif ;
     }
     body{
        border: 1px solid ;
     }
     td{
        border: 1px solid orange;
     }
    </style>
</head>
<body>
    <h1>Table format</h1>
    <table class="weekly planner">
       <thead>
        <tr>
            <th>10:00</th>
            <th>11:00</th>
            <th>12:00</th>
        </tr>
       </thead>
       <tbody>
        <tr>
            <td>Monday</td>
            <td>HMTl</td>
            <td>CSS</td>
            <td>Java script</td>
            <td>Lunch</td>
        </tr>
        <tr>
            <td>Monday</td>
            <td>HMTl</td>
            <td>CSS</td>
            <td>Java script</td>
            <td>Lunch</td>
        </tr>
       </tbody>
    

    </table>
</body>
</html>
